    <script>

    </script>
    <script src="scripts/script.js"></script>
    <script>
        // Get all gallery images and the full-screen elements
        const galleryItems = document.querySelectorAll('.gallery-item img');
        const fullscreenContainer = document.getElementById('fullscreenContainer');
        const fullscreenImage = document.getElementById('fullscreenImage');
        const closeFullscreen = document.getElementById('closeFullscreen');

        // Add click event to each gallery image
        galleryItems.forEach(image => {
            image.addEventListener('click', () => {
                fullscreenImage.src = image.src; // Set the full-screen image source
                fullscreenContainer.style.display = 'flex'; // Show the full-screen container
            });
        });

        // Close full-screen when the close button is clicked
        closeFullscreen.addEventListener('click', () => {
            fullscreenContainer.style.display = 'none'; // Hide the full-screen container
        });

        // Optional: Close full-screen when clicking outside the image
        fullscreenContainer.addEventListener('click', (e) => {
            if (e.target !== fullscreenImage) {
                fullscreenContainer.style.display = 'none';
            }
        });
    </script>
